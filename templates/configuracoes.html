{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">

    <!-- Card Principal integrando com a classe de fundo do tema atual -->
    <div class="bg-card border border-slate-700/50 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6" style="background-color: var(--card-bg, inherit); color: var(--text-color, inherit);">
        
        <!-- Cabeçalho -->
        <div class="border-b border-slate-700/50 pb-4 flex items-center gap-3">
            <span class="text-2xl">⚙️</span>
            <div>
                <h1 class="text-xl font-black tracking-tight">Configurações Gerais</h1>
                <p class="text-xs opacity-75">Parâmetros operacionais da loja</p>
            </div>
        </div>

        <!-- Formulário -->
        <form method="POST" class="space-y-5">
            
            <!-- Campo 1 -->
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider opacity-90">
                    🏷️ Nome do Restaurante
                </label>
                <input 
                    type="text" 
                    name="nome_restaurante" 
                    value="{{ config.nome_restaurante if config else '' }}" 
                    required 
                    class="w-full bg-background border border-slate-700/60 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-offset-1 transition-all shadow-inner"
                    style="background-color: rgba(0, 0, 0, 0.2); color: inherit;"
                >
                <p class="text-[11px] opacity-60">Exibido no topo do cardápio digital e recibos.</p>
            </div>

            <!-- Campo 2 -->
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider opacity-90">
                    🪑 Quantidade Total de Mesas
                </label>
                <input 
                    type="number" 
                    name="quantidade_mesas" 
                    value="{{ config.quantidade_mesas if config else '' }}" 
                    required 
                    class="w-full bg-background border border-slate-700/60 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-offset-1 transition-all shadow-inner"
                    style="background-color: rgba(0, 0, 0, 0.2); color: inherit;"
                >
                <p class="text-[11px] opacity-60">Mesas ativas para atendimento local.</p>
            </div>

            <!-- Botão Salvar -->
            <div class="pt-4">
                <button 
                    type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-98 py-4 rounded-xl text-xs sm:text-sm font-extrabold text-white transition-all shadow-xl shadow-indigo-600/30 flex items-center justify-center gap-2 border border-indigo-400/20"
                >
                    <span>💾</span>
                    <span>Salvar Configurações</span>
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}
