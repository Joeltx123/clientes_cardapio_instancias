{% extends "base.html" %}

{% block title %}Configurações - Cardápio Pro{% endblock %}

{% block content %}
<div class="card">
    <h2>Configurações do Estabelecimento</h2>
    <form action="/admin/configuracoes" method="POST">
        <div>
            <label for="nome_restaurante">Nome do Estabelecimento:</label>
            <input type="text" id="nome_restaurante" name="nome_restaurante" value="{{ config.nome_restaurante if config else 'Cardápio Pro' }}" required>
        </div>

        <div>
            <label for="quantidade_mesas">Quantidade de Mesas:</label>
            <input type="number" id="quantidade_mesas" name="quantidade_mesas" min="1" max="500" value="{{ config.quantidade_mesas if config else 5 }}" required>
        </div>

        <button type="submit">Salvar Configurações</button>
    </form>
</div>
{% endblock %}
