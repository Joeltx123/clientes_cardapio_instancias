{% extends "base.html" %}

{% block content %}
<div style="width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 20px; box-sizing: border-box;">

    <!-- Cabeçalho do Cardápio Delivery -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
            <h1 id="tituloEstabelecimento" style="font-size: 1.75rem; font-weight: 800; color: var(--text-main, #ffffff); margin: 0;">Cardápio Delivery</h1>
            <p style="font-size: 0.875rem; color: var(--text-muted, #9ca3af); margin-top: 4px;">Escolha seus itens e receba em casa com segurança.</p>
        </div>
        <div id="badgeCliente" style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; border: 1px solid rgba(16, 185, 129, 0.2);">
            🛒 <span id="qtdCarrinho">0</span> itens
        </div>
    </div>

    <!-- Categorias -->
    <div id="categoriasContainer" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 20px;">
        <button onclick="filtrarCategoria('todos')" class="cat-btn" style="padding: 10px 20px; border-radius: 20px; border: none; background: #f59e0b; color: #000; font-weight: 700; cursor: pointer; white-space: nowrap;">Todos</button>
    </div>

    <!-- Grade de Produtos -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 100px;" id="produtosContainer">
        <div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Carregando cardápio...</div>
    </div>

</div>

<!-- Barra Inferior do Carrinho / Checkout -->
<div id="barraCarrinho" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; border-top: 1px solid rgba(255,255,255,0.1); padding: 16px 20px; box-sizing: border-box; display: none; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -4px 20px rgba(0,0,0,0.5);">
    <div>
        <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">Total do Pedido:</span>
        <strong id="valorTotalCarrinho" style="color: #10b981; font-size: 1.4rem;">R$ 0,00</strong>
    </div>
    <button onclick="abrirModalCheckout()" style="background: #10b981; color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer;">
        Finalizar Pedido ➔
    </button>
</div>

<!-- Modal de Identificação e Endereço -->
<div id="modalCheckout" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box;">
    <div style="background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; width: 100%; max-width: 450px; box-sizing: border-box; max-height: 90vh; overflow-y: auto;">
        <h2 style="color: #fff; font-size: 1.3rem; margin-top: 0; margin-bottom: 16px;">Finalizar Entrega</h2>
        
        <div style="margin-bottom: 14px;">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 6px;">Seu Nome *</label>
            <input type="text" id="cliNome" placeholder="Ex: João da Silva" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 14px;">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 6px;">Seu Telefone / WhatsApp *</label>
            <input type="text" id="cliTelefone" placeholder="Ex: (27) 99999-9999" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 14px;">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 6px;">Endereço (Rua e Número) *</label>
            <input type="text" id="cliEndereco" placeholder="Ex: Rua Marechal Rondon, 120" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 14px;">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 6px;">Bairro *</label>
            <input type="text" id="cliBairro" placeholder="Ex: Centro" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 6px;">Forma de Pagamento *</label>
            <select id="cliPagamento" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box;">
                <option value="Pix" style="background: #111827;">Pix</option>
                <option value="Cartão de Crédito" style="background: #111827;">Cartão de Crédito</option>
                <option value="Cartão de Débito" style="background: #111827;">Cartão de Débito</option>
                <option value="Dinheiro" style="background: #111827;">Dinheiro</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="fecharModalCheckout()" style="width: 50%; padding: 12px; background: rgba(255,255,255,0.08); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Voltar</button>
            <button onclick="enviarPedidoDelivery()" style="width: 50%; padding: 12px; background: #10b981; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Enviar Pedido</button>
        </div>
    </div>
</div>

<script>
let produtosGlobais = [];
let carrinho = {};

document.addEventListener("DOMContentLoaded", () => {
    carregarCardapioDelivery();
});

async function carregarCardapioDelivery() {
    try {
        const res = await fetch('/api/cardapio/{{ tenant }}');
        const data = await res.json();
        
        if (data.estabelecimento) {
            document.getElementById('tituloEstabelecimento').innerText = data.estabelecimento;
        }

        produtosGlobais = data.produtos || [];
        renderizarCategorias(data.categorias || []);
        renderizarProdutos(produtosGlobais);
    } catch (e) {
        console.error("Erro ao carregar cardápio:", e);
        document.getElementById('produtosContainer').innerHTML = `<div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Erro ao carregar os produtos do cardápio.</div>`;
    }
}

function renderizarCategorias(categorias) {
    const container = document.getElementById('categoriasContainer');
    categorias.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.innerText = cat.nome;
        btn.onclick = () => {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.style.background = 'rgba(255,255,255,0.08)';
                b.style.color = 'var(--text-main, #fff)';
            });
            btn.style.background = '#f59e0b';
            btn.style.color = '#000';
            filtrarCategoria(cat.id);
        };
        btn.style.cssText = "padding: 10px 20px; border-radius: 20px; border: none; background: rgba(255,255,255,0.08); color: var(--text-main, #fff); font-weight: 700; cursor: pointer; white-space: nowrap;";
        container.appendChild(btn);
    });
}

function filtrarCategoria(catId) {
    if (catId === 'todos') {
        renderizarProdutos(produtosGlobais);
    } else {
        const filtrados = produtosGlobais.filter(p => p.categoria_id == catId);
        renderizarProdutos(filtrados);
    }
}

function renderizarProdutos(produtos) {
    const container = document.getElementById('produtosContainer');
    if (!produtos || produtos.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px;">Nenhum produto nesta categoria.</div>`;
        return;
    }

    container.innerHTML = '';
    produtos.forEach(p => {
        const card = document.createElement('div');
        card.style.cssText = "background: var(--bg-card, #111827); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;";
        card.innerHTML = `
            <div>
                <strong style="color: var(--text-main, #fff); font-size: 1.1rem; display: block; margin-bottom: 6px;">${p.nome}</strong>
                <p style="font-size: 0.85rem; color: var(--text-muted, #9ca3af); margin: 0 0 16px 0; line-height: 1.4;">${p.descricao || ''}</p>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong style="color: #10b981; font-size: 1.2rem;">R$ ${Number(p.preco).toFixed(2)}</strong>
                <button onclick="adicionarAoCarrinho(${p.id}, '${p.nome.replace(/'/g, "")}', ${p.preco})" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); padding: 8px 16px; border-radius: 12px; font-weight: 700; cursor: pointer;">+ Adicionar</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function adicionarAoCarrinho(id, nome, preco) {
    if (!carrinho[id]) {
        carrinho[id] = { id, nome, preco, qtd: 0 };
    }
    carrinho[id].qtd++;
    atualizarBarraCarrinho();
}

function atualizarBarraCarrinho() {
    let totalQtd = 0;
    let totalValor = 0;

    Object.values(carrinho).forEach(item => {
        totalQtd += item.qtd;
        totalValor += item.preco * item.qtd;
    });

    document.getElementById('qtdCarrinho').innerText = totalQtd;
    document.getElementById('valorTotalCarrinho').innerText = `R$ ${totalValor.toFixed(2)}`;

    const barra = document.getElementById('barraCarrinho');
    if (totalQtd > 0) {
        barra.style.display = 'flex';
    } else {
        barra.style.display = 'none';
    }
}

function abrirModalCheckout() {
    document.getElementById('modalCheckout').style.display = 'flex';
}

function fecharModalCheckout() {
    document.getElementById('modalCheckout').style.display = 'none';
}

async function enviarPedidoDelivery() {
    const nome = document.getElementById('cliNome').value.trim();
    const telefone = document.getElementById('cliTelefone').value.trim();
    const endereco = document.getElementById('cliEndereco').value.trim();
    const bairro = document.getElementById('cliBairro').value.trim();
    const forma_pagamento = document.getElementById('cliPagamento').value;

    if (!nome || !telefone || !endereco || !bairro) {
        alert('Por favor, preencha todos os campos obrigatórios de entrega.');
        return;
    }

    let itensArr = [];
    let totalVal = 0;
    Object.values(carrinho).forEach(item => {
        if (item.qtd > 0) {
            itensArr.push(item);
            totalVal += item.preco * item.qtd;
        }
    });

    if (itensArr.length === 0) {
        alert('Seu carrinho está vazio.');
        return;
    }

    try {
        const res = await fetch('/admin/{{ tenant }}/api/cardapio-delivery-enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                cliente_nome: nome,
                telefone: telefone,
                endereco: endereco,
                bairro: bairro,
                itens: itensArr,
                total: totalVal,
                forma_pagamento: forma_pagamento
            })
        });
        const data = await res.json();
        if (data.status === 'sucesso') {
            alert('Pedido enviado com sucesso para o estabelecimento!');
            window.location.reload();
        } else {
            alert('Erro ao enviar pedido: ' + (data.detalhe || 'Tente novamente.'));
        }
    } catch (e) {
        console.error("Erro:", e);
        alert('Erro de conexão ao enviar o pedido.');
    }
}
</script>
{% endblock %}
