<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cardápio Pro{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Cardápio Pro - Painel do Estabelecimento</h1>
        <nav style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <a href="/admin/configuracoes" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">Configurações</a>
            <a href="/admin/qrcodes" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">QR Codes</a>
            <a href="/admin/cardapio" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">Cardápio</a>
            <a href="/admin/pedidos" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">Pedidos</a>
            <a href="/admin/registros" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">Registros</a>
            <a href="/admin/analise" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">Análise</a>
            <a href="/admin/backup" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #475569;">Backup</a>
            <span class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: #94a3b8; opacity: 0.7; cursor: not-allowed;" title="Fechado por enquanto">Delivery (Em breve)</span>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
