{% extends "base.html" %}
{% block conteudo %}
<div class="bg-white rounded-xl shadow-sm border p-6 mb-6">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h2 class="text-2xl font-bold text-gray-800 capitalize">Painel de Pagamentos</h2>
            <p class="text-gray-600">Acompanhe as transações e pagamentos de mesas e pedidos.</p>
        </div>
        <button onclick="carregarPagamentos()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Atualizar
        </button>
    </div>
</div>

<div id="lista-pagamentos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="col-span-full text-center py-10 text-gray-500">
        Carregando painel de pagamentos...
    </div>
</div>

<script>
async function carregarPagamentos() {
    const container = document.getElementById("lista-pagamentos");
    try {
        const response = await fetch("/api/pagamento", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ acao: "consultar_painel", dados: {} })
        });
        const resultado = await response.json();
        
        if (resultado.status === "sucesso") {
            const transacoes = resultado.transacoes || [];
            if (transacoes.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-white rounded-xl shadow-sm border p-8 text-center text-gray-500">Nenhum pagamento registrado no momento.</div>`;
                return;
            }
            
            container.innerHTML = transacoes.map(t => `
                <div class="bg-white rounded-xl shadow-sm border p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">Transação #${t.id || '-'}</span>
                            <span class="text-xs text-gray-400">${t.criado_em || ''}</span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-800 mb-1">Mesa / Pedido: ${t.referencia || 'Geral'}</h3>
                        <p class="text-sm text-gray-600 mb-2">Forma: <span class="font-medium uppercase">${t.forma_pagamento || 'Dinheiro'}</span></p>
                        <div class="text-xl font-bold text-green-600 mb-4">R$ ${Number(t.valor || 0).toFixed(2)}</div>
                    </div>
                </div>
            `).join("");
        } else {
            container.innerHTML = `<div class="col-span-full bg-red-50 text-red-600 p-4 rounded-xl text-center">Erro ao carregar pagamentos.</div>`;
        }
    } catch (err) {
        container.innerHTML = `<div class="col-span-full bg-red-50 text-red-600 p-4 rounded-xl text-center">Erro de conexão com o servidor.</div>`;
    }
}

document.addEventListener("DOMContentLoaded", carregarPagamentos);
</script>
{% endblock %}
