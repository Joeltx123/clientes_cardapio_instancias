{% extends "base.html" %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 24px 16px;">
    <!-- Cabeçalho -->
    <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 32px;">
        <div>
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: rgba(59, 130, 246, 0.1); color: #3b82f6; font-size: 1.5rem; margin-bottom: 12px; border: 1px solid rgba(59, 130, 246, 0.2);">
                📋
            </div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main, #ffffff); letter-spacing: -0.025em; margin: 0;">Registro de Caixa - {{ nome_estabelecimento }}</h1>
            <p style="font-size: 0.875rem; color: var(--text-muted, #9ca3af); margin-top: 4px;">Histórico de mesas fechadas e pagamentos processados no sistema.</p>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <div style="padding: 12px 20px; border-radius: 14px; background: var(--bg-card, #111827); border: 1px solid var(--border-color, rgba(255,255,255,0.08)); font-weight: 700; font-size: 0.9rem; color: var(--text-main, #fff);">
                Total Faturado (Recente): <strong id="totalFaturado" style="color: #10b981;">R$ 0.00</strong>
            </div>
            <button onclick="carregarRegistros()" style="padding: 12px 16px; background: rgba(255,255,255,0.08); color: var(--text-main, #fff); border-radius: 14px; border: 1px solid var(--border-color, rgba(255,255,255,0.1)); cursor: pointer; font-weight: 600;">🔄 Atualizar</button>
        </div>
    </div>

    <!-- Tabela de Registros -->
    <div style="border-radius: 20px; background: var(--bg-card, #111827); border: 1px solid var(--border-color, rgba(255,255,255,0.08)); overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);">
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                <thead>
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); color: var(--text-muted, #9ca3af);">
                        <th style="padding: 16px 20px; font-weight: 700;">ID</th>
                        <th style="padding: 16px 20px; font-weight: 700;">Mesa</th>
                        <th style="padding: 16px 20px; font-weight: 700;">Forma de Pagamento</th>
                        <th style="padding: 16px 20px; font-weight: 700;">Valor Total</th>
                        <th style="padding: 16px 20px; font-weight: 700;">Troco</th>
                        <th style="padding: 16px 20px; font-weight: 700;">Horário</th>
                    </tr>
                </thead>
                <tbody id="tabelaRegistrosCorpo">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted, #9ca3af);">Carregando registros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    carregarRegistros();
});

async function carregarRegistros() {
    try {
        const response = await fetch('/admin/{{ tenant }}/api/registros-caixa');
        const data = await response.json();

        const tbody = document.getElementById('tabelaRegistrosCorpo');
        const totalFaturadoEl = document.getElementById('totalFaturado');

        if (!data.registros || data.registros.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted, #9ca3af);">Nenhum registro de caixa encontrado.</td></tr>';
            totalFaturadoEl.innerText = 'R$ 0.00';
            return;
        }

        tbody.innerHTML = '';
        let somaTotal = 0;

        data.registros.forEach(r => {
            somaTotal += r.total;
            const tr = document.createElement('tr');
            tr.style.cssText = "border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.2s;";
            tr.onmouseover = () => tr.style.background = 'rgba(255,255,255,0.02)';
            tr.onmouseout = () => tr.style.background = 'transparent';

            tr.innerHTML = `
                <td style="padding: 16px 20px; font-weight: 700; color: var(--text-muted);">#${r.id}</td>
                <td style="padding: 16px 20px; font-weight: 800; color: var(--text-main, #fff);">Mesa #${r.mesa}</td>
                <td style="padding: 16px 20px; color: var(--text-main, #f9fafb);">${r.forma_pagamento}</td>
                <td style="padding: 16px 20px; font-weight: 800; color: #10b981;">R$ ${r.total.toFixed(2)}</td>
                <td style="padding: 16px 20px; color: var(--text-muted);">R$ ${r.troco.toFixed(2)}</td>
                <td style="padding: 16px 20px; color: var(--text-muted); font-size: 0.8rem;">${r.horario}</td>
            `;
            tbody.appendChild(tr);
        });

        totalFaturadoEl.innerText = `R$ ${somaTotal.toFixed(2)}`;
    } catch (e) {
        console.error("Erro ao carregar registros:", e);
    }
}
</script>
{% endblock %}
