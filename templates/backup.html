{% extends "base.html" %}
{% block conteudo %}
<div class="max-w-7xl mx-auto space-y-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Backup e Exportação</h2>
            <p class="text-sm text-gray-500">Gere e baixe backups criptografados com dados financeiros e relatórios em Excel.</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 max-w-xl space-y-4">
        <div class="flex items-center gap-3 text-slate-900">
            <i data-lucide="shield-check" class="w-8 h-8 text-emerald-500"></i>
            <div>
                <h3 class="font-bold text-lg">Gerador de Backup Seguro</h3>
                <p class="text-xs text-gray-500">O arquivo ZIP gerado é protegido com criptografia AES (Senha padrão: <code class="bg-gray-100 px-1 py-0.5 rounded font-mono text-slate-800">Soulivre01</code>)</p>
            </div>
        </div>

        <form action="/backup/gerar" method="POST" class="space-y-4 pt-2">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Identificador (Slug) do Estabelecimento</label>
                <input type="text" name="slug" value="padrao" required class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm">
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-2 text-sm">
                <i data-lucide="database" class="w-4 h-4"></i> Gerar e Salvar Backup
            </button>
        </form>
    </div>
</div>
<script>
    lucide.createIcons();
</script>
{% endblock %}
